<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>香港交易廣場天台生成器</title>
    <meta property="og:image" content="./thumbnail.jpg" />
    <link rel="icon" href="./thumbnail.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="hero">
      <h1>香港交易廣場天台生成器</h1>
      <p>重塑《大時代》經典一刻，輸入日期、時間與地點即時出圖。</p>
    </header>

    <main class="workspace">
      <section class="controls" aria-label="Generator controls">
        <label class="field">
          <span>日期</span>
          <input id="dateInput" type="date" />
        </label>

        <label class="field">
          <span>時間</span>
          <input id="timeInput" type="time" step="60" />
        </label>

        <label class="field">
          <span>地點</span>
          <input id="locationInput" type="text" placeholder="香港交易廣場天台" maxlength="34" />
        </label>

        <div class="actions">
          <button id="resetButton" type="button">重設</button>
          <button id="downloadButton" type="button">下載 PNG</button>
        </div>

        <p id="caption" class="caption" aria-live="polite"></p>
      </section>

      <section class="stage" aria-label="Generated image">
        <canvas id="previewCanvas" width="1120" height="852"></canvas>
      </section>
    </main>

    <footer class="foot">
      <a class="foot-link" href="https://github.com/ShawTim/ifc-roof" target="_blank" rel="noreferrer">
        <img src="./github.png" alt="GitHub" width="24" height="24" />
      </a>
      <span>
        Created by
        <a href="https://github.com/ShawTim" target="_blank" rel="noreferrer">ShawTim</a>.
      </span>
    </footer>
  </body>
</html>
