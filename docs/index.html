  <body>
    <header class="hero">
      <h1>香港交易廣場天台生成器</h1>
      <p>重塑《大時代》經典一刻，輸入日期、時間與地點即時出圖。</p>
    </header>

    <main class="workspace">
      <section class="controls" aria-label="Generator controls">
        <label class="field">
          <span>日期</span>
          <input id="dateInput" type="date" />
        </label>

        <label class="field">
          <span>時間</span>
          <input id="timeInput" type="time" step="60" />
        </label>

        <label class="field">
          <span>地點</span>
          <input id="locationInput" type="text" placeholder="香港交易廣場天台" maxlength="34" />
        </label>

        <div class="actions">
          <button id="resetButton" type="button">重設</button>
          <button id="downloadButton" type="button">下載 PNG</button>
        </div>

        <p id="caption" class="caption" aria-live="polite"></p>
      </section>

      <section class="stage" aria-label="Generated image">
        <canvas id="previewCanvas" width="1120" height="852"></canvas>
      </section>
    </main>
